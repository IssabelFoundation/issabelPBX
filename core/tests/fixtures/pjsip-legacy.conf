
; Trunks


[provider-ip]
type=aor
contact=sip:192.0.2.1

[provider-register]
type=aor
contact=sip:account@sip.example.test:5080

[provider-inbound]
type=aor
max_contacts=1

[provider-ip]
type=auth
auth_type=userpass
username=provider-ip
password=
username=provider-ip

[provider-register]
type=auth
auth_type=userpass
username=account
password=test-secret

[provider-inbound]
type=auth
auth_type=userpass
username=provider-inbound
password=test-secret
username=provider-inbound

[provider-ip]
type=identify
endpoint=provider-ip
match=192.0.2.0/24

[provider-register]
type=identify
endpoint=provider-register
match=sip.example.test:5080

[provider-inbound]
type=identify
endpoint=provider-inbound
match=192.0.2.3


[provider-register]
type=registration
endpoint=provider-register
line=yes
outbound_auth=provider-register
server_uri=sip:sip.example.test:5080
client_uri=sip:account@sip.example.test:5080
transport=transport-udp
retry_interval=60
outbound_proxy=sip:proxy.example.test:5090\;lr


[provider-ip]
type=endpoint
aors=provider-ip
disallow=all
context=from-pstn
transport=transport-udp
allow=alaw,ulaw

[provider-register]
type=endpoint
aors=provider-register
disallow=all
outbound_auth=provider-register
context=from-pstn
transport=transport-udp

[provider-inbound]
type=endpoint
aors=provider-inbound
disallow=all
auth=provider-inbound
context=from-pstn

